<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="refresh" content="0;url=%BASE_URL%" />
    <script>
      (function() {
        var redirectBase = '%BASE_URL%';
        if (!redirectBase.endsWith('/')) redirectBase += '/';
        var locationPath = window.location.pathname;
        var search = window.location.search || '';
        var hash = window.location.hash || '';
        window.location.replace(redirectBase + 'index.html#' + locationPath + search + hash);
      })();
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
